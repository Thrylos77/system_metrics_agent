name: CI/CD - System Metrics Agent

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Tests + SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest -q --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  build-scan-push:
    name: Build + Trivy + Docker Hub
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Cache-bust key (weekly)
        id: cachebust
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Build API image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile.api
          load: true
          tags: system-metrics-api:${{ github.sha }}
          pull: true
          build-args: |
            CACHE_BUST=${{ steps.cachebust.outputs.week }}
          cache-from: type=gha,scope=system-metrics-api
          cache-to: type=gha,mode=max,scope=system-metrics-api,ignore-error=true

      - name: Trivy report (api, lisible dans les logs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: system-metrics-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '0'

      - name: Scan API image with Trivy (gate + SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: system-metrics-api:${{ github.sha }}
          format: sarif
          output: trivy-api.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Upload API Trivy SARIF
        if: always() && hashFiles('trivy-api.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.38.1
        with:
          sarif_file: trivy-api.sarif

      - name: Build agent image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile.agent
          load: true
          tags: system-metrics-agent:${{ github.sha }}
          pull: true
          build-args: |
            CACHE_BUST=${{ steps.cachebust.outputs.week }}
          cache-from: type=gha,scope=system-metrics-agent
          cache-to: type=gha,mode=max,scope=system-metrics-agent,ignore-error=true

      - name: Trivy report (agent, lisible dans les logs)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: system-metrics-agent:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '0'

      - name: Scan agent image with Trivy (gate + SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: system-metrics-agent:${{ github.sha }}
          format: sarif
          output: trivy-agent.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

      - name: Upload agent Trivy SARIF
        if: always() && hashFiles('trivy-agent.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.38.1
        with:
          sarif_file: trivy-agent.sarif

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag system-metrics-api:${GITHUB_SHA} ${DOCKERHUB_USERNAME}/system-metrics-api:${GITHUB_SHA}
          docker tag system-metrics-api:${GITHUB_SHA} ${DOCKERHUB_USERNAME}/system-metrics-api:latest
          docker push ${DOCKERHUB_USERNAME}/system-metrics-api:${GITHUB_SHA}
          docker push ${DOCKERHUB_USERNAME}/system-metrics-api:latest

      - name: Push agent image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag system-metrics-agent:${GITHUB_SHA} ${DOCKERHUB_USERNAME}/system-metrics-agent:${GITHUB_SHA}
          docker tag system-metrics-agent:${GITHUB_SHA} ${DOCKERHUB_USERNAME}/system-metrics-agent:latest
          docker push ${DOCKERHUB_USERNAME}/system-metrics-agent:${GITHUB_SHA}
          docker push ${DOCKERHUB_USERNAME}/system-metrics-agent:latest