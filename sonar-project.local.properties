# ---- SonarQube local (Docker, http://localhost:9000) ----
# Usage : voir section 7 du guide (-Dproject.settings=sonar-project.local.properties)
# Pas de sonar.organization ici : ce parametre n'existe que sur SonarQube Cloud.
sonar.projectKey=system-metrics-agent
sonar.projectName=System Metrics Agent (local)

sonar.sources=app
sonar.tests=app/tests
sonar.test.inclusions=app/tests/**/*.py
sonar.exclusions=app/tests/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
